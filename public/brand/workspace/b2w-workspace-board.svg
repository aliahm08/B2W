<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">B2W Workspace visual brand board</title>
  <desc id="desc">A visual overview of B2W's unified workspace palette, typography, status language, content journey, and product accents.</desc>
  <rect width="1600" height="1000" fill="#FAFAF8"/>
  <rect x="64" y="56" width="1472" height="888" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="64" y="56" width="1472" height="92" fill="#111111"/>
  <text x="104" y="112" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">B2W Workspace</text>
  <text x="1496" y="110" fill="#A3A3A3" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="end" letter-spacing="2">SYSTEM 01</text>

  <text x="104" y="220" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3">BRAND PROMISE</text>
  <text x="104" y="286" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="500" letter-spacing="-2">Make business complexity</text>
  <text x="104" y="346" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="500" letter-spacing="-2">clear enough to act on.</text>
  <text x="104" y="400" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="20">Clear · Grounded · Operational · Human · Decisive</text>

  <line x1="104" y1="454" x2="1496" y2="454" stroke="#E5E5E5"/>

  <text x="104" y="506" fill="#737373" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">FOUNDATION</text>
  <g transform="translate(104 536)">
    <rect width="136" height="116" fill="#FAFAF8" stroke="#D4D4D4"/>
    <text x="16" y="88" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Canvas</text>
    <text x="16" y="106" fill="#737373" font-family="monospace" font-size="11">#FAFAF8</text>
  </g>
  <g transform="translate(252 536)">
    <rect width="136" height="116" fill="#111111"/>
    <text x="16" y="88" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Ink</text>
    <text x="16" y="106" fill="#A3A3A3" font-family="monospace" font-size="11">#111111</text>
  </g>
  <g transform="translate(400 536)">
    <rect width="136" height="116" fill="#4F7F52"/>
    <text x="16" y="88" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Active</text>
    <text x="16" y="106" fill="#E5EFE6" font-family="monospace" font-size="11">#4F7F52</text>
  </g>
  <g transform="translate(548 536)">
    <rect width="136" height="116" fill="#D8B536"/>
    <text x="16" y="88" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Gate</text>
    <text x="16" y="106" fill="#49400D" font-family="monospace" font-size="11">#D8B536</text>
  </g>
  <g transform="translate(696 536)">
    <rect width="136" height="116" fill="#C63D2F"/>
    <text x="16" y="88" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Risk</text>
    <text x="16" y="106" fill="#FBE4E1" font-family="monospace" font-size="11">#C63D2F</text>
  </g>
  <g transform="translate(844 536)">
    <rect width="136" height="116" fill="#B24A24"/>
    <text x="16" y="88" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">JasonAI</text>
    <text x="16" y="106" fill="#FFE8DC" font-family="monospace" font-size="11">#B24A24</text>
  </g>
  <g transform="translate(992 536)">
    <rect width="136" height="116" fill="#A66589"/>
    <text x="16" y="88" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Clara</text>
    <text x="16" y="106" fill="#FBEAF2" font-family="monospace" font-size="11">#A66589</text>
  </g>

