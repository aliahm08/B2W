  <text x="104" y="724" fill="#737373" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">CONTENT JOURNEY</text>
  <g transform="translate(104 752)">
    <rect width="1392" height="132" fill="#111111"/>
    <line x1="278" y1="0" x2="278" y2="132" stroke="#333333"/>
    <line x1="556" y1="0" x2="556" y2="132" stroke="#333333"/>
    <line x1="834" y1="0" x2="834" y2="132" stroke="#333333"/>
    <line x1="1112" y1="0" x2="1112" y2="132" stroke="#333333"/>
    <g transform="translate(22 24)"><text fill="#D8B536" font-family="monospace" font-size="11">01</text><text y="42" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Orient</text><text y="70" fill="#A3A3A3" font-family="Inter, Arial, sans-serif" font-size="13">Who, what, why now.</text></g>
    <g transform="translate(300 24)"><text fill="#D8B536" font-family="monospace" font-size="11">02</text><text y="42" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Diagnose</text><text y="70" fill="#A3A3A3" font-family="Inter, Arial, sans-serif" font-size="13">Show operating friction.</text></g>
    <g transform="translate(578 24)"><text fill="#D8B536" font-family="monospace" font-size="11">03</text><text y="42" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Resolve</text><text y="70" fill="#A3A3A3" font-family="Inter, Arial, sans-serif" font-size="13">Explain the work sequence.</text></g>
    <g transform="translate(856 24)"><text fill="#D8B536" font-family="monospace" font-size="11">04</text><text y="42" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Prove</text><text y="70" fill="#A3A3A3" font-family="Inter, Arial, sans-serif" font-size="13">Evidence, state, trust.</text></g>
    <g transform="translate(1134 24)"><text fill="#D8B536" font-family="monospace" font-size="11">05</text><text y="42" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Advance</text><text y="70" fill="#A3A3A3" font-family="Inter, Arial, sans-serif" font-size="13">One clear next action.</text></g>
  </g>

  <text x="104" y="924" fill="#A3A3A3" font-family="Inter, Arial, sans-serif" font-size="12">Derived from the Operating Map, internal portal, Services, JasonAI, Clara, and the B2W website shell.</text>
  <text x="1496" y="924" fill="#A3A3A3" font-family="monospace" font-size="11" text-anchor="end">B2W / WORKSPACE / 2026</text>
