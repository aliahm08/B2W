    <rect width="316" height="146" fill="#111111"/>
    <text x="24" y="34" fill="#D8B536" font-family="monospace" font-size="11" letter-spacing="2">TYPE SYSTEM</text>
    <text x="24" y="80" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="-1">Today’s view.</text>
    <text x="24" y="110" fill="#A3A3A3" font-family="Inter, Arial, sans-serif" font-size="14">Inter for clarity and control.</text>
    <text x="24" y="132" fill="#737373" font-family="monospace" font-size="11">MONO FOR STATE + EVIDENCE</text>
