<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gurge device interface references</title>
  <style>
    :root{--ink:#171a18;--forest:#101713;--green:#4f7f52;--sage:#dfe9d8;--paper:#f6f6f1;--line:#dfe2dc;--gold:#d2ad45;--red:#c85b4d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    button,input,textarea{font:inherit}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.eyebrow{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.17em;text-transform:uppercase;color:#717771}
    .topbar{height:76px;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.1)}
    .brand{display:flex;align-items:center;gap:12px}.brandmark{width:42px;height:42px;background:var(--sage);display:grid;place-items:center}.brandmark img{width:29px;height:29px;object-fit:contain}.brand b{font-size:15px}.brand small{margin-left:7px;font:7px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#9fc2a2;text-transform:uppercase}.crumb{margin-top:4px;font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.28)}
    .headnav{display:flex;height:76px;align-items:stretch}.headnav span{display:grid;place-items:center;padding:0 22px;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.48)}.headnav .active{background:rgba(255,255,255,.05);color:#fff;border-bottom:2px solid #9fc2a2}.live{display:flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.12);padding:11px 13px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9fc2a2}.live i{width:8px;height:8px;border-radius:50%;background:#8fbd9b;box-shadow:0 0 0 5px rgba(143,189,155,.12)}
    .desktop-shell{min-height:809px;background:var(--paper)}.desktop-body{display:grid;grid-template-columns:178px 1fr;min-height:733px}.side{background:#edf0eb;border-right:1px solid #d8ddd8;padding:18px 13px;display:flex;flex-direction:column}.side-title{padding:0 10px 14px;border-bottom:1px solid rgba(0,0,0,.08)}.side nav{padding-top:9px}.side a{display:flex;align-items:center;gap:11px;padding:13px 11px;margin-bottom:3px;color:#666d67;font-size:12px;font-weight:650;text-decoration:none}.side a:before{content:"";width:10px;height:10px;border:2px solid var(--green);border-radius:2px}.side a.active{background:#172019;color:white}.side a.active:before{border-color:#9fc2a2}.side-state{margin-top:auto;border:1px solid #c9d9c9;background:#e7f0e6;padding:14px 12px}.side-state b{font-size:9px;color:#315e3a;text-transform:uppercase;letter-spacing:.12em}.side-state p{font-size:9px;line-height:1.5;color:#758078;margin:9px 0 0}
    .desktop-main{padding:25px 24px 20px}.desktop-title{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #d8d9d3;padding-bottom:20px}.desktop-title h1{font-size:39px;line-height:1;margin:9px 0 0;letter-spacing:-.045em}.desktop-title p{font-size:14px;color:#777d78;max-width:760px;line-height:1.65;margin:17px 0 0}.status-pill{border:1px solid #bcd0bd;border-radius:20px;background:#edf4eb;color:#315e3a;padding:9px 13px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px;border:1px solid var(--line);background:white}.metric{padding:18px;border-right:1px solid var(--line)}.metric:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.metric.gold .dot{background:var(--gold)}.metric.red .dot{background:var(--red)}.metric strong{display:block;font:26px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:20px}.metric label{display:block;margin-top:6px;font-size:9px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;color:#939893}.metric small{display:block;margin-top:9px;font-size:10px;color:#a2a6a2}
    .dash-grid{display:grid;grid-template-columns:1.27fr .73fr;gap:16px;margin-top:16px}.panel{border:1px solid var(--line);background:white}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:17px;margin:7px 0 0}.job-row{display:grid;grid-template-columns:1fr 145px 26px;align-items:center;gap:16px;padding:17px 19px;border-bottom:1px solid var(--line)}.job-row:last-child{border:0}.job-row h3{font-size:14px;margin:0}.sub{font-size:10px;color:#8a8f8a;margin-top:5px}.source{font-size:9px;color:var(--green);font-weight:650;margin-top:9px}.badge{display:inline-block;border-radius:20px;padding:5px 9px;margin-left:8px;font-size:8px;font-weight:750;letter-spacing:.11em;text-transform:uppercase}.ok{background:#dce9dc;color:#315e3a}.warn{background:#f0e4bd;color:#75570f}.blocked{background:#f2d9d4;color:#8e3327}.progress{font-size:9px;color:#9a9e9a}.bar{height:6px;background:#edecea;border-radius:8px;margin-top:8px}.bar i{display:block;height:100%;background:var(--green);border-radius:8px}.stream{background:#172019;color:white;border-color:#263a2a}.stream .panel-head{border-color:rgba(255,255,255,.1)}.stream .panel-head .eyebrow{color:rgba(255,255,255,.35)}.stream .panel-head h2{color:white}.signal{padding:17px 18px;border-bottom:1px solid rgba(255,255,255,.09)}.signal small{font-size:8px;color:#9fc2a2;text-transform:uppercase;letter-spacing:.13em}.signal h3{font-size:12px;margin:6px 0 0}.signal p{font-size:10px;color:rgba(255,255,255,.35);margin:5px 0 0}.signal.flash{background:rgba(159,194,162,.11);box-shadow:inset 3px 0 #9fc2a2}.toast{position:absolute;right:34px;top:92px;background:#dfe9d8;color:#17321f;border:1px solid #9fc2a2;padding:13px 16px;box-shadow:0 14px 34px rgba(0,0,0,.18);font-size:11px;font-weight:700}
    .tablet-shell{width:100%;min-height:1366px;background:#f6f6f1}.tablet-shell .topbar{height:84px}.tablet-nav{display:flex;overflow:hidden;border-bottom:1px solid var(--line);background:white;padding:0 20px}.tablet-nav span{padding:16px 19px;font-size:11px;font-weight:700;color:#7a807a;border-bottom:3px solid transparent}.tablet-nav .active{color:#17321f;border-color:#4f7f52}.tablet-main{padding:28px}.tablet-title{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #d8d9d3;padding-bottom:24px}.tablet-title h1{font-size:43px;line-height:1;margin:10px 0 0;letter-spacing:-.045em}.tablet-title p{max-width:550px;color:#777d78;line-height:1.6;margin:15px 0 0}.summary{display:grid;grid-template-columns:repeat(3,125px);border:1px solid var(--line);background:white}.summary div{padding:16px;border-right:1px solid var(--line)}.summary div:last-child{border:0}.summary b{font:24px ui-monospace,SFMono-Regular,Menlo,monospace}.summary small{display:block;margin-top:6px;color:#999;font-size:8px;text-transform:uppercase;letter-spacing:.12em}.filters{display:flex;gap:8px;align-items:center;margin-top:24px}.search{height:46px;flex:1;border:1px solid var(--line);background:white;padding:0 15px;color:#777}.filter{border:0;border-radius:24px;background:transparent;padding:11px 15px;font-size:11px;font-weight:700;color:#6e746f}.filter.active{background:#172019;color:white}.tracker-list{margin-top:16px;border:1px solid var(--line);background:white}.tracker-head,.tracker-row{display:grid;grid-template-columns:1.55fr .65fr .5fr .55fr;gap:15px;align-items:center}.tracker-head{padding:13px 18px;background:#fafaf6;color:#969b96;font-size:8px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}.tracker-row{padding:21px 18px;border-top:1px solid var(--line)}.tracker-row h3{font-size:15px;margin:0}.tracker-row p{font-size:10px;color:#888;margin:6px 0 0}.tracker-row strong{font-size:12px}.tracker-row.flash{background:#edf4eb;box-shadow:inset 4px 0 #4f7f52}.tablet-note{margin-top:18px;background:#172019;color:white;padding:22px;display:flex;align-items:center;justify-content:space-between}.tablet-note b{font-size:14px}.tablet-note span{font-size:10px;color:#9fc2a2}.tablet-note p{margin:6px 0 0;color:rgba(255,255,255,.48);font-size:11px}
    .mobile-shell{width:430px;min-height:932px;background:#f7f7f3;padding-bottom:84px}.mobile-head{height:74px;background:#101713;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 15px}.mobile-brand{display:flex;align-items:center;gap:10px}.mobile-brand span{width:36px;height:36px;background:#dfe9d8;display:grid;place-items:center}.mobile-brand img{width:25px;height:25px}.mobile-brand b{font-size:14px}.mobile-brand p{font:7px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fc2a2;text-transform:uppercase;letter-spacing:.14em;margin:4px 0 0}.mobile-user{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:12px}.mobile-main{padding:18px 16px}.back{font-size:10px;font-weight:700;color:#4f7f52}.job-hero{margin-top:13px;border-bottom:1px solid var(--line);padding-bottom:18px}.job-hero .badge{margin-left:0}.job-hero h1{font-size:28px;line-height:1.03;letter-spacing:-.04em;margin:12px 0 0}.job-hero p{font-size:12px;color:#747b75;margin:8px 0 0}.job-meta{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border:1px solid var(--line);background:white}.job-meta div{padding:12px;border-right:1px solid var(--line)}.job-meta div:last-child{border:0}.job-meta small{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#9a9e9a}.job-meta b{display:block;font-size:11px;margin-top:5px}.report-card{margin-top:16px;border:1px solid var(--line);background:white;padding:16px}.report-card h2{font-size:18px;margin:5px 0 0}.field{display:block;margin-top:15px}.field>span{display:block;font-size:8px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#777e78;margin-bottom:7px}.segments{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.segments i{font-style:normal;text-align:center;padding:9px 4px;border:1px solid var(--line);font-size:9px;font-weight:700;color:#767c77}.segments i.active{background:#172019;color:white;border-color:#172019}.range{height:7px;background:#ecece8;border-radius:8px}.range i{display:block;width:56%;height:100%;background:#4f7f52;border-radius:8px}.field-line{border:1px solid #d6d9d3;background:#fafaf7;padding:11px 12px;font-size:11px;line-height:1.45;color:#555d56;min-height:44px}.photo-row{display:flex;gap:8px}.photo{width:62px;height:56px;border:1px dashed #b9c1b9;background:#eef2eb;display:grid;place-items:center;color:#4f7f52;font-size:9px;text-align:center}.photo.done{border-style:solid;background:#dfe9d8}.submit{margin-top:16px;width:100%;height:46px;border:0;background:#172019;color:white;font-size:12px;font-weight:750}.success{margin-top:16px;border:1px solid #9fc2a2;background:#e7f0e6;padding:15px;color:#315e3a}.success b{font-size:13px}.success p{font-size:10px;line-height:1.5;margin:6px 0 0}.recent{margin-top:12px;border:1px solid var(--line);background:white;padding:14px}.recent h3{font-size:13px;margin:0}.recent p{font-size:10px;line-height:1.5;color:#6c736d}.bottomnav{position:fixed;left:0;right:0;bottom:0;height:72px;border-top:1px solid #dedede;background:rgba(255,255,255,.97);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px 10px;box-shadow:0 -12px 30px rgba(0,0,0,.08)}.bottomnav div{display:flex;min-height:50px;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;color:#737873;font-size:9px;font-weight:650}.bottomnav i{width:16px;height:16px;border:2px solid currentColor;border-radius:4px}.bottomnav .active{background:#171a18;color:white}.bottomnav .home i{border-radius:50% 50% 4px 4px}.bottomnav .track i{border-radius:50%}.bottomnav .report i{border-width:2px 2px 5px}
  </style>
</head>
<body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),mode=q.get('mode')||'desktop',state=q.get('state')||'base';
const logo='/public/brand/gurge-logo.png';
const renderTop=(path,active='Today')=>`<div class="topbar"><div class="brand"><div class="brandmark"><img src="${logo}"></div><div><div><b>Gurge</b><small>Operator OS</small></div><div class="crumb">fieldstone-services / ${path}</div></div></div><div class="headnav"><span class="${active==='Today'?'active':''}">Today</span><span class="${active==='Jobs'?'active':''}">Jobs</span><span>Schedule</span><span>Inbox</span></div><div class="live"><i></i>AI maintained</div></div>`;
function desktop(){let flash=state==='update',attention=state==='attention';return `<div class="desktop-shell">${renderTop('today','Today')}<div class="desktop-body"><aside class="side"><div class="side-title eyebrow">Pinned views</div><nav><a class="active">Today</a><a>Jobs</a><a>Schedule</a><a>Inbox</a><a>Reports</a></nav><div class="side-state"><b>● Live · AI maintained</b><p>Texts, email, field reports, and connected systems are current.</p></div></aside><main class="desktop-main"><div class="desktop-title"><div><div class="eyebrow">Owner view · delivery + accountability</div><h1>Today’s operations.</h1><p>${flash?'A new field report moved Main Street forward and cleared one review item.':'Four active jobs are moving from confirmed field reports, schedules, and customer decisions.'}</p></div><div class="status-pill">● Live operating record</div></div><div class="metrics"><div class="metric"><div class="dot"></div><strong>4</strong><label>Active jobs</label><small>$394.5k active value</small></div><div class="metric gold"><div class="dot"></div><strong>${flash?'7':'8'}</strong><label>Open actions</label><small>Reconciled now</small></div><div class="metric red"><div class="dot"></div><strong>${flash?'1':'2'}</strong><label>Needs review</label><small>${flash?'Field report cleared':'1 client decision'}</small></div><div class="metric"><div class="dot"></div><strong>${flash?'93%':'91%'}</strong><label>On-time rate</label><small>Across confirmed dates</small></div></div><div class="dash-grid"><section class="panel"><div class="panel-head"><div class="eyebrow">Current operating record</div><h2>Work reconstructed from field reporting</h2></div>${job('North Harbor Renovation','On track','Maya Torres · Aug 23','Electrical inspection · 18 min ago',72,'ok')}${job('Main Street Buildout',flash?'On track':'Needs review','Avery Reed · Aug 16',flash?'Field report · now':'Estimator email · 8:42 AM',flash?56:48,flash?'ok':'warn',flash)}${job('Cedar House Service Plan','Blocked','Sam Khan · Aug 14','Vendor confirmation · waiting',34,'blocked')}</section><aside class="panel stream"><div class="panel-head"><div class="eyebrow">Live change stream</div><h2>Reports becoming dashboard updates</h2></div><div class="signal ${flash?'flash':''}"><small>${flash?'Field report':'Crew text'} · ${flash?'now':'18 min'}</small><h3>${flash?'Main Street progress updated to 56%':'Electrical inspection passed'}</h3><p>${flash?'Checklist complete · photo evidence attached':'North Harbor · marked complete'}</p></div><div class="signal ${attention?'flash':''}"><small>Client decision · 8 min</small><h3>Revised layout approval received</h3><p>Main Street · next task released</p></div><div class="signal"><small>PM update · 14 min</small><h3>Plumber confirmed for Thursday</h3><p>Main Street · schedule protected</p></div></aside></div>${flash?'<div class="toast">✓ Field report reconciled across 4 records</div>':''}</main></div></div>`}
function job(name,status,meta,source,progress,tone,flash=false){return `<div class="job-row ${flash?'flash':''}"><div><h3>${name}<span class="badge ${tone}">${status}</span></h3><div class="sub">${meta}</div><div class="source">↗ ${source}</div></div><div class="progress">Progress <span style="float:right">${progress}%</span><div class="bar"><i style="width:${progress}%"></i></div></div><div style="color:#aaa">›</div></div>`}
function tablet(){let review=state==='review',updated=state==='updated';let rows=review?[['Main Street Buildout','Avery Reed','Aug 16','$96,800','Needs review',48,'warn'],['Cedar House Service Plan','Sam Khan','Aug 14','$42,000','Blocked',34,'blocked']]:[['North Harbor Renovation','Maya Torres','Aug 23','$184,200','On track',72,'ok'],['Main Street Buildout','Avery Reed','Aug 16','$96,800',updated?'On track':'Needs review',updated?56:48,updated?'ok':'warn'],['Cedar House Service Plan','Sam Khan','Aug 14','$42,000','Blocked',34,'blocked'],['Portfolio Preventive Maintenance','Jordan Ellis','Sep 02','$71,500','On track',86,'ok']];return `<div class="tablet-shell">${renderTop('jobs','Jobs')}<div class="tablet-nav"><span>Today</span><span class="active">Jobs</span><span>Schedule</span><span>Inbox</span><span>Reports</span></div><main class="tablet-main"><div class="tablet-title"><div><div class="eyebrow">AI-maintained job record</div><h1>Job tracker.</h1><p>Every job, owner, deadline, progress report, and next action in one field-ready view.</p></div><div class="summary"><div><b>${review?2:4}</b><small>Jobs shown</small></div><div><b>${updated?1:2}</b><small>Review</small></div><div><b>${updated?'93%':'91%'}</b><small>On time</small></div></div></div><div class="filters"><div class="search">⌕ Search jobs, customers, or owners</div><button class="filter ${!review?'active':''}">All</button><button class="filter ${review?'active':''}">Needs review</button><button class="filter">Blocked</button></div><div class="tracker-list"><div class="tracker-head"><span>Job</span><span>Owner</span><span>Due / value</span><span>Status</span></div>${rows.map((r,i)=>`<div class="tracker-row ${updated&&i===1?'flash':''}"><div><h3>${r[0]}</h3><p>${updated&&i===1?'Field report · updated now':'Latest report source-linked'} · ${r[5]}% complete</p><div class="bar"><i style="width:${r[5]}%"></i></div></div><strong>${r[1]}</strong><div><strong>${r[2]}</strong><p>${r[3]}</p></div><span class="badge ${r[6]}" style="margin:0;text-align:center">${r[4]}</span></div>`).join('')}</div><div class="tablet-note"><div><b>${updated?'Main Street report received':'Tracker is live'}</b><p>${updated?'Progress, checklist, and owner view updated from the field.':'Filter the portfolio, open a job, and verify every status against its report.'}</p></div><span>${updated?'RECONCILED NOW':'4 REPORT SOURCES LIVE'}</span></div></main></div>`}
function mobile(){let photo=state==='photo',success=state==='success';return `<div class="mobile-shell"><header class="mobile-head"><div class="mobile-brand"><span><img src="${logo}"></span><div><b>Gurge</b><p>fieldstone-services / jobs</p></div></div><div class="mobile-user">AR</div></header><main class="mobile-main"><div class="back">‹ All jobs</div><section class="job-hero"><span class="badge ${success?'ok':'warn'}">${success?'Report submitted':'In progress'}</span><h1>Main Street Buildout</h1><p>June & Pine Retail · 218 Main Street</p><div class="job-meta"><div><small>Owner</small><b>Avery</b></div><div><small>Due</small><b>Aug 16</b></div><div><small>Progress</small><b>${success?'56%':'48%'}</b></div></div></section>${success?`<div class="success"><b>✓ Job report submitted</b><p>Progress, completed work, photos, and open issues were added to the operating record.</p></div><div class="recent"><div class="eyebrow">Latest field report · now</div><h3>Back-counter rough-in completed</h3><p>Electrical boxes set, plumbing route confirmed, and two site photos attached. Waiting on client layout approval.</p><span class="badge ok" style="margin:8px 0 0">Source retained</span></div>`:`<section class="report-card"><div class="eyebrow">Job-level reporting</div><h2>Report today’s work.</h2><label class="field"><span>Job status</span><div class="segments"><i>On track</i><i class="active">Needs review</i><i>Blocked</i></div></label><label class="field"><span>Progress · 48%</span><div class="range"><i></i></div></label><label class="field"><span>Work completed</span><div class="field-line">Back-counter rough-in completed. Electrical boxes set and plumbing route confirmed.</div></label><label class="field"><span>Issues or decisions needed</span><div class="field-line">Waiting on client approval for revised layout before field set is issued.</div></label><label class="field"><span>Photos</span><div class="photo-row"><div class="photo ${photo?'done':''}">${photo?'✓ Site photo':'＋ Add photo'}</div>${photo?'<div class="photo done">✓ Detail</div>':''}</div></label><button class="submit">${photo?'Submit job report':'Add evidence and continue'}</button></section>`}</main><nav class="bottomnav"><div class="home"><i></i><span>Home</span></div><div><i></i><span>Jobs</span></div><div class="track"><i></i><span>Track</span></div><div class="report active"><i></i><span>Report</span></div></nav></div>`}
document.getElementById('app').innerHTML=mode==='desktop'?desktop():mode==='tablet'?tablet():mobile();
</script></body></html>
